name: Auto Fetch Weibo

on:
  schedule:
    # 每 10 分钟自动运行一次
    - cron: '*/10 * * * *'
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-content: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: pip install requests
      
    - name: Run Fetcher
      run: python fetch.py
      
    - name: Commit and Push
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add posts.json
        git diff-index --quiet HEAD || git commit -m "Auto update posts" -a
        git push
