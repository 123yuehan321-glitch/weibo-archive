<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> TSH微博存档</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; font-size: 1.2rem; color: #666; margin-bottom: 20px; }
    .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .time { font-size: 0.85rem; color: #999; margin-bottom: 8px; }
    .text { line-height: 1.6; word-break: break-all; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
    .grid img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ 社会队时光机 (自动存档)</h1>
    <div id="app">数据加载中...</div>
  </div>

  <script>
    fetch('posts.json')
      .then(res => res.json())
      .then(data => {
        const app = document.getElementById('app');
        if(!data.length) { app.innerHTML = '<p style="text-align:center">暂无存档</p>'; return; }
        
        app.innerHTML = data.map(post => `
          <div class="card">
            <div class="time">${post.created_at}</div>
            <div class="text">${post.text}</div>
            ${post.pics.length ? `
              <div class="grid">
                ${post.pics.map(url => `<img src="${url}" referrerpolicy="no-referrer" loading="lazy">`).join('')}
              </div>
            ` : ''}
          </div>
        `).join('');
      })
      .catch(() => {
        document.getElementById('app').innerHTML = '<p style="text-align:center">初始化中，请稍后刷新...</p>';
      });
  </script>
</body>
</html>
